<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 606" width="880" height="606" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Chat agent architecture</title><desc>The chat page sends a message to the server. The server resolves dates, recalls memory from the DB, makes one streamed model call with web search as the only tool, streams the reply back, saves the chat, then extracts claims into the DB.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#55524c"/></marker></defs>
<rect width="880" height="606" rx="14" fill="#ffffff"/>
<rect x="46" y="20" width="100" height="34" rx="17" fill="#f4f2ee" stroke="#77736c" stroke-width="1.4"/><text x="96" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1c1a">User</text>
<line x1="96" y1="54" x2="96" y2="105" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="16" y="110" width="160" height="72" rx="9" fill="#f4f2ee" stroke="#77736c" stroke-width="1.4"/>
<text x="96.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1c1a">Chat page</text>
<text x="96.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#1d1c1a" opacity=".82">browser</text>
<rect x="248" y="66" width="336" height="520" rx="12" fill="#f6faf8" stroke="#2f5d50" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="262" y="90" font-size="13" font-weight="700" fill="#2f5d50" letter-spacing=".04em">SERVER</text>
<rect x="262" y="110" width="308" height="72" rx="9" fill="#e8f1ee" stroke="#2f5d50" stroke-width="1.4"/>
<text x="416.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#12332b">Chat API</text>
<text x="416.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#12332b" opacity=".82">takes the message, streams the reply</text>
<rect x="262" y="206" width="308" height="72" rx="9" fill="#e8f1ee" stroke="#2f5d50" stroke-width="1.4"/>
<text x="416.0" y="236.0" text-anchor="middle" font-size="15" font-weight="700" fill="#12332b">1. Date resolver</text>
<text x="416.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#12332b" opacity=".82">"last Tuesday" becomes a real date</text>
<rect x="262" y="302" width="308" height="72" rx="9" fill="#e8f1ee" stroke="#2f5d50" stroke-width="1.4"/>
<text x="416.0" y="332.0" text-anchor="middle" font-size="15" font-weight="700" fill="#12332b">2. Memory recall</text>
<text x="416.0" y="352.0" text-anchor="middle" font-size="12.5" fill="#12332b" opacity=".82">by date, by topic, recent timeline</text>
<rect x="262" y="398" width="308" height="72" rx="9" fill="#e8f1ee" stroke="#2f5d50" stroke-width="1.4"/>
<text x="416.0" y="428.0" text-anchor="middle" font-size="15" font-weight="700" fill="#12332b">3. Agent</text>
<text x="416.0" y="448.0" text-anchor="middle" font-size="12.5" fill="#12332b" opacity=".82">one streamed model call</text>
<rect x="262" y="494" width="308" height="72" rx="9" fill="#e8f1ee" stroke="#2f5d50" stroke-width="1.4"/>
<text x="416.0" y="524.0" text-anchor="middle" font-size="15" font-weight="700" fill="#12332b">4. Claim ledger</text>
<text x="416.0" y="544.0" text-anchor="middle" font-size="12.5" fill="#12332b" opacity=".82">runs after the reply is sent</text>
<line x1="416" y1="182" x2="416" y2="201" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="416" y1="278" x2="416" y2="297" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="416" y1="374" x2="416" y2="393" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="416" y1="470" x2="416" y2="489" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/>
<line x1="176" y1="134" x2="257" y2="134" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<text x="214" y="126" text-anchor="middle" font-size="12" fill="#55524c">message</text>
<line x1="262" y1="160" x2="181" y2="160" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<text x="214" y="177" text-anchor="middle" font-size="12" fill="#55524c">reply stream</text>
<rect x="16" y="258" width="160" height="328" rx="12" fill="#fffaf0" stroke="#a8741a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="30" y="282" font-size="13" font-weight="700" fill="#a8741a" letter-spacing=".04em">DB</text>
<rect x="30" y="308" width="132" height="60" rx="9" fill="#fdf3dc" stroke="#a8741a" stroke-width="1.4"/>
<text x="96.0" y="332.0" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3208">Search index</text>
<text x="96.0" y="352.0" text-anchor="middle" font-size="12.5" fill="#4a3208" opacity=".82">full-text</text>
<rect x="30" y="404" width="132" height="60" rx="9" fill="#fdf3dc" stroke="#a8741a" stroke-width="1.4"/>
<text x="96.0" y="428.0" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3208">Chats</text>
<text x="96.0" y="448.0" text-anchor="middle" font-size="12.5" fill="#4a3208" opacity=".82">with timestamps</text>
<rect x="30" y="500" width="132" height="60" rx="9" fill="#fdf3dc" stroke="#a8741a" stroke-width="1.4"/>
<text x="96.0" y="524.0" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3208">Claims</text>
<text x="96.0" y="544.0" text-anchor="middle" font-size="12.5" fill="#4a3208" opacity=".82">entity, fact, source</text>
<line x1="262" y1="338" x2="181" y2="338" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<text x="214" y="330" text-anchor="middle" font-size="12" fill="#55524c">read</text>
<line x1="262" y1="434" x2="181" y2="434" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<text x="214" y="426" text-anchor="middle" font-size="12" fill="#55524c">save chat</text>
<line x1="262" y1="530" x2="181" y2="530" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<text x="214" y="522" text-anchor="middle" font-size="12" fill="#55524c">save claims</text>
<rect x="648" y="258" width="216" height="328" rx="12" fill="#f8f7ff" stroke="#5a52b5" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="662" y="282" font-size="13" font-weight="700" fill="#5a52b5" letter-spacing=".04em">MODEL API</text>
<rect x="666" y="300" width="180" height="60" rx="9" fill="#ecebfb" stroke="#5a52b5" stroke-width="1.4"/>
<text x="756.0" y="324.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26215c">Web search</text>
<text x="756.0" y="344.0" text-anchor="middle" font-size="12.5" fill="#26215c" opacity=".82">the only tool</text>
<rect x="666" y="404" width="180" height="60" rx="9" fill="#ecebfb" stroke="#5a52b5" stroke-width="1.4"/>
<text x="756.0" y="439.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26215c">Chat model</text>
<rect x="666" y="500" width="180" height="60" rx="9" fill="#ecebfb" stroke="#5a52b5" stroke-width="1.4"/>
<text x="756.0" y="524.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26215c">Small model</text>
<text x="756.0" y="544.0" text-anchor="middle" font-size="12.5" fill="#26215c" opacity=".82">claim extraction</text>
<line x1="756" y1="399" x2="756" y2="365" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="570" y1="434" x2="661" y2="434" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="616" y="426" text-anchor="middle" font-size="12" fill="#55524c">prompt</text>
<text x="616" y="451" text-anchor="middle" font-size="12" fill="#55524c">stream</text>
<line x1="570" y1="530" x2="661" y2="530" stroke="#55524c" stroke-width="1.6" marker-end="url(#a)"/>
<text x="616" y="522" text-anchor="middle" font-size="12" fill="#55524c">extract</text>
<rect x="648" y="66" width="216" height="172" rx="12" fill="#faf9f6" stroke="#d9d5cc" stroke-width="1.2"/>
<text x="664" y="92" font-size="13" font-weight="700" fill="#1d1c1a">How to read this</text>
<text x="664" y="114" font-size="12.5" fill="#44423d">Steps 1 to 4 run in order for</text>
<text x="664" y="131" font-size="12.5" fill="#44423d">every message.</text>
<text x="664" y="148" font-size="12.5" fill="#44423d"></text>
<text x="664" y="165" font-size="12.5" fill="#44423d">Memory is looked up first and</text>
<text x="664" y="182" font-size="12.5" fill="#44423d">given to the model as context,</text>
<text x="664" y="199" font-size="12.5" fill="#44423d">so web search stays the</text>
<text x="664" y="216" font-size="12.5" fill="#44423d">model's only tool.</text>
</svg>