<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --text: #1d1c1a; --muted: #77736c;
    --line: #e6e2db; --accent: #2f5d50; --user: #efece6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1e1e1b; --text: #ecebe6; --muted: #98948b;
      --line: #32312d; --accent: #8fc7b3; --user: #2a2a26;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  header .title { font-weight: 600; }
  header .now { color: var(--muted); font-size: 13px; margin-left: 10px; }
  button { font: inherit; cursor: pointer; }
  #new {
    background: none; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 12px; font-size: 14px;
  }
  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .col { max-width: 760px; margin: 0 auto; }
  .empty { color: var(--muted); margin-top: 18vh; text-align: center; }
  .empty h1 { color: var(--text); font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .empty .tries { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; align-items: center; }
  .empty .tries button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font-size: 14px; max-width: 100%; text-align: left;
  }
  .msg { margin: 0 0 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user); border-radius: 16px; padding: 9px 15px;
    max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.bot .body { overflow-wrap: anywhere; }
  .body > :first-child { margin-top: 0; }
  .body > :last-child { margin-bottom: 0; }
  .body a { color: var(--accent); }
  .body a.cite {
    font-size: 11px; text-decoration: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 0 5px; margin-left: 2px; vertical-align: 2px;
  }
  .body pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; }
  .body code { font-size: 14px; }
  .tablewrap { overflow-x: auto; }
  .body table { border-collapse: collapse; font-size: 14.5px; }
  .body th, .body td { border-bottom: 1px solid var(--line); padding: 6px 12px 6px 0; text-align: left; vertical-align: top; }
  .status { color: var(--muted); font-size: 13.5px; margin-bottom: 6px; min-height: 20px; }
  .status.live::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .status.live::after { animation: none; } }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .sources a {
    font-size: 12.5px; color: var(--muted); text-decoration: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 10px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .error { color: #b3412f; }
  footer { padding: 12px 16px 18px; }
  form {
    display: flex; gap: 8px; align-items: flex-end; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px;
  }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: none; color: var(--text);
    font: inherit; max-height: 180px; padding: 5px 0;
  }
  #send {
    background: var(--accent); color: var(--bg); border: 0; border-radius: 10px;
    padding: 7px 14px; font-weight: 600;
  }
  #send:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<header>
  <div><span class="title">Chat agent</span><span class="now" id="now"></span></div>
  <button id="new" title="Start a fresh chat. Memory is kept.">New chat</button>
</header>
<main id="scroll"><div class="col" id="log"></div></main>
<footer><div class="col">
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask anything" autofocus></textarea>
    <button id="send">Send</button>
  </form>
</div></footer>

<script>
const log = document.getElementById("log");
const scroll = document.getElementById("scroll");
const input = document.getElementById("input");
const send = document.getElementById("send");

// a session is one chat thread. memory spans all of them.
let sessionId = localStorage.getItem("sessionId") || newSession();
function newSession() {
  const id = crypto.randomUUID();
  localStorage.setItem("sessionId", id);
  return id;
}

const TRIES = [
  "What did I ask you on 3 November? Is your answer still correct today?",
  "Last Tuesday I asked you about Postgres hosting. Has any pricing changed since then?",
  "On Monday we shortlisted 5 CRM tools. Has any of them changed pricing or shipped something big since?",
];

function showEmpty() {
  log.innerHTML = "";
  const box = document.createElement("div");
  box.className = "empty";
  box.innerHTML = "<h1>What do you want to know?</h1><div>I can search the web, and I remember what we talked about and when.</div>";
  const tries = document.createElement("div");
  tries.className = "tries";
  for (const t of TRIES) {
    const b = document.createElement("button");
    b.textContent = t;
    b.onclick = () => ask(t);
    tries.append(b);
  }
  box.append(tries);
  log.append(box);
}

function render(md) {
  const html = DOMPurify.sanitize(marked.parse(md, { breaks: true }));
  const div = document.createElement("div");
  div.innerHTML = html;
  for (const a of div.querySelectorAll("a")) {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    if (/^\d+$/.test(a.textContent)) a.className = "cite"; // our [1] markers
  }
  for (const t of div.querySelectorAll("table")) {
    const wrap = document.createElement("div");
    wrap.className = "tablewrap";
    t.replaceWith(wrap);
    wrap.append(t);
  }
  return div;
}

function addUser(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  el.append(b);
  log.append(el);
}

function addBot() {
  const el = document.createElement("div");
  el.className = "msg bot";
  const status = document.createElement("div");
  status.className = "status live";
  status.textContent = "Thinking";
  const body = document.createElement("div");
  body.className = "body";
  el.append(status, body);
  log.append(el);
  return { el, status, body };
}

function addSources(el, sources) {
  if (!sources || !sources.length) return;
  const row = document.createElement("div");
  row.className = "sources";
  const seen = new Set();
  for (const s of sources) {
    if (!/^https?:\/\//.test(s.url)) continue;
    const a = document.createElement("a");
    a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    // Google hands back redirect links, so the title (usually the site) reads better than the host
    const host = new URL(s.url).hostname.replace(/^www\./, "");
    a.textContent = host.includes("vertexaisearch") && s.title ? s.title : host;
    if (seen.has(a.textContent)) continue; // one chip per site
    seen.add(a.textContent);
    a.title = s.title;
    row.append(a);
  }
  el.append(row);
}

function toBottom() { scroll.scrollTop = scroll.scrollHeight; }

async function ask(text) {
  text = text.trim();
  if (!text || send.disabled) return;
  if (log.querySelector(".empty")) log.innerHTML = "";
  send.disabled = true;
  input.value = ""; input.style.height = "auto";
  addUser(text);
  const bot = addBot();
  toBottom();

  let answer = "";
  const marks = []; // { at, n, url }: where each citation number goes in the text
  const urls = []; // urls in the order they were first cited
  // put the [1] markers in from the back so earlier positions stay valid
  const withMarks = () => {
    let md = answer;
    for (const m of [...marks].sort((a, b) => b.at - a.at || b.n - a.n)) {
      const at = Math.min(m.at, md.length);
      md = md.slice(0, at) + ` [${m.n}](${m.url})` + md.slice(at);
    }
    return md;
  };
  const unlock = () => {
    bot.status.classList.remove("live");
    bot.status.textContent = "";
    send.disabled = false;
    input.focus();
  };
  const handle = (e) => {
    if (e.type === "status") bot.status.textContent = e.text;
    else if (e.type === "text") { answer += e.text; bot.body.replaceChildren(render(withMarks())); bot.status.textContent = ""; }
    else if (e.type === "reset") { answer = ""; marks.length = 0; bot.body.replaceChildren(); }
    else if (e.type === "cite" && /^https?:\/\//.test(e.source.url)) {
      let n = urls.indexOf(e.source.url) + 1;
      if (!n) n = urls.push(e.source.url);
      const at = e.at ?? answer.length;
      if (!marks.some((m) => m.at === at && m.n === n)) marks.push({ at, n, url: e.source.url });
      bot.body.replaceChildren(render(withMarks()));
    }
    else if (e.type === "sources") addSources(bot.el, e.sources);
    else if (e.type === "done") unlock(); // the answer is complete, even if the server is still tidying up
    else if (e.type === "error") {
      const p = document.createElement("p"); p.className = "error"; p.textContent = e.message;
      bot.body.append(p);
    }
    toBottom();
  };

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ sessionId, message: text }),
    });
    if (!res.ok || !res.body) throw new Error("request failed");
    // read the event stream by hand: EventSource can't POST
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, cut); buf = buf.slice(cut + 2);
        if (line.startsWith("data: ")) handle(JSON.parse(line.slice(6)));
      }
    }
  } catch {
    handle({ type: "error", message: "Lost the connection. Try again." });
  }
  unlock();
}

async function load() {
  try {
    const data = await (await fetch("/api/session?id=" + encodeURIComponent(sessionId))).json();
    document.getElementById("now").textContent = data.now;
    if (!data.exchanges.length) return showEmpty();
    for (const e of data.exchanges) {
      addUser(e.question);
      const bot = addBot();
      bot.status.remove();
      bot.body.replaceChildren(render(e.answer));
      addSources(bot.el, e.sources);
    }
    toBottom();
  } catch { showEmpty(); }
}

document.getElementById("form").onsubmit = (ev) => { ev.preventDefault(); ask(input.value); };
input.onkeydown = (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); ask(input.value); }
};
input.oninput = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; };
document.getElementById("new").onclick = () => { sessionId = newSession(); showEmpty(); input.focus(); };
load();
</script>
</body>
</html>
